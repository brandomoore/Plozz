name: Check TestFlight fix declarations

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  declarations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check incoming declarations against main
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'refs/remotes/origin/main' }}
        run: python3 tools/testflight-resolutions.py --lint "$BASE" HEAD
