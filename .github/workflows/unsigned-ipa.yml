name: Unsigned IPA

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Unsigned ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, tvos]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install XcodeGen if missing
        run: command -v xcodegen || brew install xcodegen
      - name: Build unsigned device app
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: tools/build-unsigned-ipa.sh "$PLATFORM"
      - name: Upload unsigned IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Plozz-${{ matrix.platform }}-unsigned
          path: |
            ${{ steps.build.outputs.ipa_path }}
            ${{ steps.build.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach unsigned IPAs to release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download unsigned IPAs
        uses: actions/download-artifact@v4
        with:
          pattern: Plozz-*-unsigned
          merge-multiple: true
          path: dist
      - name: Verify the release exists
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
      - name: Upload unsigned IPAs
        run: |
          set -euo pipefail
          mapfile -t ipas < <(find dist -type f -name '*.ipa' | sort)
          test "${#ipas[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${ipas[@]}" --clobber --repo "$GITHUB_REPOSITORY"
