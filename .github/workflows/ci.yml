name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_PARAMETERS: "'safe.bareRepository=all'"

jobs:
  guards:
    name: Deterministic preflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure workspace scratch
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.build/ci-scratch"
          printf 'TMPDIR=%s/.build/ci-scratch\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Architecture layering guard
        run: python3 tools/arch-guard.py

      - name: Test hygiene guard
        run: python3 tools/test-hygiene.py

      - name: Localization guard
        run: tools/l10n-guard.sh

      - name: Localization importer regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_l10n_*.py'

      - name: Release notes regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_release_notes*.py'

      - name: Package storage regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_package_storage.py'

      - name: Fastlane pipeline regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_fastlane_pipeline.py'

      - name: CI simulator regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_ci_simulator.py'

      - name: CI pipeline regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_ci_pipeline.py'

      - name: XCTest result regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_xcresult_summary.py'

      # Freshness still runs locally; CI validates the committed catalog without
      # rebuilding both platforms for extraction.
      - name: Localization catalog validation
        run: python3 tools/l10n-sync.py --validate-only

      - name: Localization source snapshot
        run: |
          python3 tools/l10n-export-source.py .build/ci-scratch/plozz-l10n-delta.json \
            --missing-for nl \
            --check-snapshot

      - name: Retain preflight diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: guards-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ci-scratch/plozz-l10n-delta.json
          if-no-files-found: ignore
          retention-days: 7

  app-build:
    name: Build tvOS simulator app
    needs: guards
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare isolated build and caches
        id: prepare
        uses: ./.github/actions/ci-prepare
        with:
          lane: app-build

      - name: Build (tvOS Simulator)
        run: |
          source tools/lib/swift-package-storage.sh
          configure_plozz_package_resolution "$PLOZZ_CLONED_SOURCE_PACKAGES"
          set +e
          tools/with-apple-build-lease.sh plozz/ci-tvos-build -- xcodebuild build \
            -project Plozz.xcodeproj \
            -scheme Plozz \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$PLOZZ_DERIVED_DATA" \
            "${PACKAGE_RESOLUTION_ARGS[@]}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$PLOZZ_LOG_DIR/app-build.log"
          statuses=("${PIPESTATUS[@]}")
          if [[ "${statuses[0]}" -ne 0 ]]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"

      - name: Save successful trusted caches
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: ./.github/actions/ci-save
        with:
          lane: app-build
          build-key: ${{ steps.prepare.outputs.build-key }}
          build-hit: ${{ steps.prepare.outputs.build-hit }}
          build-paths: ${{ steps.prepare.outputs.build-paths }}
          package-key: ${{ steps.prepare.outputs.package-key }}
          package-hit: ${{ steps.prepare.outputs.package-hit }}
          seed-packages: 'true'

      - name: Retain build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ci-logs/app-build
          if-no-files-found: ignore
          retention-days: 7

  package-tests:
    name: Full package test matrix
    needs: guards
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare isolated build and caches
        id: prepare
        uses: ./.github/actions/ci-prepare
        with:
          lane: package-tests

      - name: Run full test matrix (tvOS Simulator, build-once)
        run: python3 tools/run-bounded.py 2400 "CI full test matrix" -- tools/run-tests.sh

      - name: Save successful trusted caches
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: ./.github/actions/ci-save
        with:
          lane: package-tests
          build-key: ${{ steps.prepare.outputs.build-key }}
          build-hit: ${{ steps.prepare.outputs.build-hit }}
          build-paths: ${{ steps.prepare.outputs.build-paths }}

      - name: Retain test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-tests-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/ci-logs/package-tests
            .build/test-results
          if-no-files-found: ignore
          retention-days: 7

  hosted-focus:
    name: App-hosted focus tests
    needs: guards
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare isolated build and caches
        id: prepare
        uses: ./.github/actions/ci-prepare
        with:
          lane: hosted-focus

      - name: Run app-hosted episode focus tests
        run: tools/run-focus-tests.sh

      - name: Save successful trusted caches
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: ./.github/actions/ci-save
        with:
          lane: hosted-focus
          build-key: ${{ steps.prepare.outputs.build-key }}
          build-hit: ${{ steps.prepare.outputs.build-hit }}
          build-paths: ${{ steps.prepare.outputs.build-paths }}

      - name: Retain test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-focus-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/ci-logs/hosted-focus
            .build/focus-test-results
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing required-check name. Default `needs` handling would skip
  # this job after a failed/cancelled preflight, which must never look green.
  build-and-test:
    name: Build and test tvOS app
    needs: [guards, app-build, package-tests, hosted-focus]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          expected = {"guards", "app-build", "package-tests", "hosted-focus"}
          needs = json.loads(os.environ["NEEDS_JSON"])
          if set(needs) != expected:
              sys.exit("Missing or unexpected CI dependency")
          failed = {name: result.get("result") for name, result in needs.items()
                    if result.get("result") != "success"}
          if failed:
              sys.exit(f"CI lanes did not all succeed: {failed}")
          print("All guards, app compilation, full package tests, and hosted tests passed.")
          PY
