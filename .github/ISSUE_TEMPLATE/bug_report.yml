name: Bug report
description: Something in Plozz is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check [existing issues](https://github.com/brandomoore/Plozz/issues) first. Never share passwords, tokens, or server URLs with credentials.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Tell us what happened and what you expected instead.
      placeholder: Episodes marked as watched become unwatched again after restarting Plozz.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can reproduce it, tell us how.
      placeholder: |
        1. Go to '...'
        2. Select '...'
        3. See error
    validations:
      required: false
  - type: dropdown
    id: backend
    attributes:
      label: Media source
      description: Select the server or source affected by this bug. You can select more than one. If it happens before setup or you don't know, select "Not applicable / not sure".
      multiple: true
      options:
        - Jellyfin
        - Emby
        - Plex
        - Silo
        - SMB share
        - IPTV / M3U
        - All sources
        - Not applicable / not sure
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Plozz version & build
      description: Find it in Settings → About.
      placeholder: 2026.9.29 (45)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS version
      placeholder: Apple TV 4K, tvOS 27 / iPhone, iOS 27 / iPad, iPadOS 27
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Anything else?
      description: Server version, last working Plozz build, screenshots, or logs. Remove any secrets.
    validations:
      required: false
